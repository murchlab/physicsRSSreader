# Email login for the digest.
# Copy this file to smtpSettings.ini (same folder) and fill it in.
# smtpSettings.ini is git-ignored, so the password never ends up on GitHub.

[smtp]
# Gmail: smtp.gmail.com / 587. For another provider, ask IT for the SMTP host and port.
host = smtp.gmail.com
port = 587

# The account that logs in and sends the digest.
user = your.digest.account@gmail.com

# For Gmail this must be an *app password* (Google Account -> Security -> 2-Step Verification -> App passwords),
# not your normal password.
password =

# Optional: what appears in the From line, e.g.  Quantum Digest <your.digest.account@gmail.com>
# Leave blank to use the user address.
sender =
